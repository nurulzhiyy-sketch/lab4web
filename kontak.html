<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - Ruang Mahasiswa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <header>
            <h1>Ruang Mahasiswa</h1>
        </header>

        <nav>
            <a href="home.html">Home</a>
            <a href="#">Artikel</a>
            <a href="about.html">About</a>
            <a href="kontak.html">Kontak</a>
        </nav>

        <section id="hero">
            <h1>Hubungi Kami</h1>
            <p>Punya pertanyaan atau saran? Kirim pesan melalui formulir ini.</p>
        </section>

        <div id="wrapper">
            <section id="main">
                <h2>Formulir Kontak</h2>

                <form>
                    <p>
                        <label for="nama">Nama:</label><br>
                        <input type="text" id="nama" name="nama" required>
                    </p>

                    <p>
                        <label for="email">Email:</label><br>
                        <input type="email" id="email" name="email" required>
                    </p>

                    <p>
                        <label for="pesan">Pesan:</label><br>
                        <textarea id="pesan" name="pesan" rows="5" required></textarea>
                    </p>

                    <button type="submit">Kirim Pesan</button>
                </form>
            </section>

            <aside id="sidebar">
                <h2>Informasi</h2>
                <p>Silakan isi formulir jika ingin menyampaikan pertanyaan atau saran.</p>
            </aside>
        </div>

        <footer>
            <p>Ruang Mahasiswa - Belajar dan Berkembang</p>
        </footer>
    </div>
</body>
</html>
